  <script type="text/javascript">
    $(function () {
      var current = location.pathname;
      $('.contMenuItems li a').each(function () {
        var $this = $(this);
        // if the current path is like this link, make it active
        if ($this.attr('href').indexOf(current) !== -1) {
          $this.addClass('active');
        }
      })
    })

    //********************************** //
    //  CÓDIGO TARJETAS MODIFICADO CGPT //
    //********************************** // 

    const nodes = [].slice.call(document.querySelectorAll('.cont-li'), 0);

    const directions = {
      0: 'top',
      1: 'right',
      2: 'bottom',
      3: 'left'
    };

    const classNames = ['in', 'out']
      .map(p => Object.values(directions).map(d => `${p}-${d}`))
      .reduce((a, b) => a.concat(b));


    // Detecta por qué lado entra o sale el cursor
    const getDirectionKey = (ev, node) => {

      const {
        width,
        height,
        top,
        left
      } = node.getBoundingClientRect();

      // Posición del cursor dentro de la tarjeta
      const l = ev.pageX - (left + window.pageXOffset);
      const t = ev.pageY - (top + window.pageYOffset);

      // Centro de la tarjeta
      const centerX = width / 2;
      const centerY = height / 2;

      // Distancia del cursor respecto al centro
      const x = l - centerX;
      const y = t - centerY;

      /*
       * Normalizamos X e Y de acuerdo con las dimensiones
       * de la tarjeta.
       *
       * Esto permite trabajar correctamente con tarjetas
       * rectangulares, por ejemplo 300x200, 400x250, etc.
       */
      const normalizedX = Math.abs(x / width);
      const normalizedY = Math.abs(y / height);


      // El cursor está más cerca del eje horizontal
      if (normalizedX > normalizedY) {

        // Derecha
        if (x > 0) {
          return 1;
        }

        // Izquierda
        return 3;
      }


      // El cursor está más cerca del eje vertical

      // Abajo
      if (y > 0) {
        return 2;
      }

      // Arriba
      return 0;
    };


    class Item {

      constructor(element) {

        this.element = element;

        this.element.addEventListener('mouseover', ev => {
          this.update(ev, 'in');
        });

        this.element.addEventListener('mouseout', ev => {
          this.update(ev, 'out');
        });

      }


      update(ev, prefix) {

        this.element.classList.remove(...classNames);

        this.element.classList.add(
          `${prefix}-${directions[getDirectionKey(ev, this.element)]}`
        );

      }

    }


    nodes.forEach(node => new Item(node));

  <script>
    // BOTÓN BACK TO TOP
    (function () {
      const btn = document.getElementById('btnTop');
      const SHOW_AFTER = 300; // px de scroll para mostrarlo
      let ticking = false;

      // Mostrar/ocultar según scroll (con throttle para rendimiento)
      function toggleVisibility() {
        if (window.scrollY > SHOW_AFTER) {
          btn.classList.add('is-visible');
        } else {
          btn.classList.remove('is-visible');
        }
        ticking = false;
      }

      window.addEventListener('scroll', () => {
        if (!ticking) {
          window.requestAnimationFrame(toggleVisibility);
          ticking = true;
        }
      }, { passive: true });

      // Acción: scroll suave al top
      btn.addEventListener('click', () => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({
          top: 0,
          behavior: reduceMotion ? 'auto' : 'smooth'
        });
        // Devuelve el foco al inicio para accesibilidad con teclado
        btn.blur();
      });

      // Estado inicial (por si se recarga a media página)
      toggleVisibility();
    })();
